[package]
name = "margin-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
futures = "0.3.34"
margin-agent = { version = "0.1.0", path = "../agent" }
margin-domain = { version = "0.1.0", path = "../domain" }
margin-llm = { version = "0.1.0", path = "../llm" }
margin-store = { version = "0.1.0", path = "../store" }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
chrono-tz = "0.10.4"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
