<script>
var pill=document.getElementById('pill'),rows=document.getElementById('rows');
function move(r){var a=rows.getBoundingClientRect(),b=r.getBoundingClientRect();pill.style.transform='translateY('+(b.top-a.top)+'px)';}
setTimeout(function(){pill.style.transition='none';move(document.querySelector('[aria-current]'));requestAnimationFrame(function(){pill.style.transition='';});},80);
document.querySelectorAll('[data-nav]').forEach(function(r){r.onclick=function(){document.querySelectorAll('[aria-current]').forEach(function(x){x.removeAttribute('aria-current')});r.setAttribute('aria-current','page');move(r);};});
document.querySelectorAll('[data-toggle]').forEach(function(r){r.onclick=function(){var c=document.getElementById(r.dataset.toggle),open=r.getAttribute('aria-expanded')==='true';r.setAttribute('aria-expanded',!open);if(open)c.setAttribute('data-closed','');else c.removeAttribute('data-closed');setTimeout(function(){move(document.querySelector('[aria-current]'))},400);};});
</script>
