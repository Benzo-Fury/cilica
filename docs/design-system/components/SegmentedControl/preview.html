<!-- @dsCard group="Inputs" height=90 subtitle="The Notes / Transcript switch. The thumb springs to the selection (⌘E)." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>

<div class="nt-pad">
 <div class="nt-seg" role="tablist" id="seg"><span class="nt-seg-thumb"></span>
  <button role="tab" aria-selected="true"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-notebook-pen nt-ico" aria-hidden="true"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></svg>Notes</button>
  <button role="tab" aria-selected="false"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-audio-lines nt-ico" aria-hidden="true"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>Transcript</button>
 </div>
 <div class="nt-seg" role="tablist" id="seg2"><span class="nt-seg-thumb"></span>
  <button role="tab" aria-selected="true">Sans</button><button role="tab" aria-selected="false">Serif</button><button role="tab" aria-selected="false">Mono</button>
 </div>
</div>


<script>
function seg(id){var s=document.getElementById(id),t=s.querySelector('.nt-seg-thumb'),b=[].slice.call(s.querySelectorAll('button'));
function place(x){t.style.width=x.offsetWidth+'px';t.style.transform='translateX('+(x.offsetLeft-2)+'px)';}
b.forEach(function(x){x.onclick=function(){b.forEach(function(y){y.setAttribute('aria-selected',y===x)});place(x);};});
requestAnimationFrame(function(){t.style.transition='none';place(b[0]);requestAnimationFrame(function(){t.style.transition='';});});}
setTimeout(function(){seg('seg');seg('seg2');},60);
</script>
</body>
</html>
