<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Margin cover</title>
<style>
  html, body { margin: 0; background: var(--bg-canvas); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--bg-canvas); }
  .cv svg { position: absolute; inset: 0; }
  .accent { fill: var(--accent); }
  .ink { fill: var(--ink); }
  .soft { fill: var(--accent-soft); }
  .rec { fill: var(--rec); }
  .cut { fill: var(--bg-canvas); }
  .line { fill: var(--accent-text); }
  .r-xl { rx: var(--radius-xl); }
  .r-lg { rx: var(--radius-lg); }
  .name { position: absolute; left: 40px; bottom: 36px; width: 440px; }
  .name h1 { margin: 0; font: 640 120px/0.92 var(--font-sans); letter-spacing: -0.035em; color: var(--ink); font-variation-settings: "opsz" 32; }
  .name p { margin: 16px 0 0; font: 450 14px/20px var(--font-sans); color: var(--ink-2); }
</style></head>
<body>
<div class="cv">
  <!--
    blocks: accent 248×252 (radius-xl), ink 152×120 (radius-xl), accent-soft 152×116 (radius-xl), rec disc r10
    arrangement: one tall amber slab with two stacked satellites to its right, all right of x=480, inset space-6 top and bottom
    pattern: the recorder's level meter (soft, large radii → pills), 12 canvas-coloured pills cut out of the amber slab, plus three note lines in the soft block; Margin is audio turned into notes
    steps: pill width 10 = space-2 + space-0-5, gap 8 = space-2, block gap 16 = space-4, radii radius-xl and pill (half the short side)
  -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect class="accent r-xl" x="512" y="24" width="248" height="252"/>
    <rect class="ink r-xl" x="776" y="24" width="152" height="120"/>
    <rect class="soft r-xl" x="776" y="160" width="152" height="116"/>
    <circle class="rec" cx="900" cy="52" r="10"/>
    <g>
      <rect class="cut" x="542" y="131" width="10" height="38" rx="5"/>
      <rect class="cut" x="560" y="108" width="10" height="84" rx="5"/>
      <rect class="cut" x="578" y="86" width="10" height="128" rx="5"/>
      <rect class="cut" x="596" y="116" width="10" height="68" rx="5"/>
      <rect class="cut" x="614" y="72" width="10" height="156" rx="5"/>
      <rect class="cut" x="632" y="100" width="10" height="100" rx="5"/>
      <rect class="cut" x="650" y="124" width="10" height="52" rx="5"/>
      <rect class="cut" x="668" y="92" width="10" height="116" rx="5"/>
      <rect class="cut" x="686" y="112" width="10" height="76" rx="5"/>
      <rect class="cut" x="704" y="134" width="10" height="32" rx="5"/>
      <rect class="cut" x="722" y="120" width="10" height="60" rx="5"/>
    </g>
    <rect class="line" x="796" y="188" width="104" height="8" rx="4"/>
    <rect class="line" x="796" y="208" width="84" height="8" rx="4"/>
    <rect class="line" x="796" y="228" width="56" height="8" rx="4"/>
  </svg>
  <div class="name">
    <h1>Margin</h1>
    <p>Private meeting notes: glass at the edges, calm in the middle, quick to move.</p>
  </div>
</div>
</body>
</html>
