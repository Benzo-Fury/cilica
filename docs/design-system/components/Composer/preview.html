<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>

<div class="nt-stack" style="padding:20px;max-width:400px;gap:16px">
 <div class="nt-composer"><textarea id="c1" rows="1" placeholder="Ask about your notes, or tell Cilica what to change"></textarea>
  <div class="nt-composer-row"><button class="nt-iconbtn nt-anim"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus nt-ico nt-i-plus" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button><button class="nt-chip"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text nt-ico" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>This note</button><button class="nt-send" disabled aria-label="Send"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up nt-ico nt-i-up" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button></div></div>
 <div class="nt-composer"><textarea id="c2" rows="1">Turn the decisions into a follow-up email to Marco</textarea>
  <div class="nt-composer-row"><span class="nt-step" style="height:auto"><span class="nt-shimmer">Writing…</span></span><button class="nt-send" aria-label="Stop" style="background:var(--ink);color:var(--bg-canvas)"><span style="width:9px;height:9px;border-radius:2px;background:currentColor"></span></button></div></div>
</div>



</body>
</html>
