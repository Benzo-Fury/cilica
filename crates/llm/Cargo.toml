[package]
name = "cilica-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
eventsource-stream = "0.2.3"
futures = "0.3.34"
cilica-domain = { path = "../domain" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "process", "io-util", "time", "fs"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
