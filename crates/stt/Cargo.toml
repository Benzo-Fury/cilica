[package]
name = "cilica-stt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
crossbeam-channel = "0.5.17"
futures = "0.3.34"
cilica-domain = { path = "../domain" }
cilica-onnx = { path = "../onnx" }
ort = "2.0.0-rc.15"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "fs", "io-util", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
whisper-rs = "0.16.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[dev-dependencies]
hound = "3.5.1"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
