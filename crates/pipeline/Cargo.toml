[package]
name = "margin-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["opus"]
# Keep recordings as Ogg Opus (see margin-audio). Without it they are kept as WAV.
opus = ["margin-audio/opus"]

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
futures = "0.3.34"
hound = "3.5.1"
margin-audio = { version = "0.1.0", path = "../audio", default-features = false }
margin-detect = { version = "0.1.0", path = "../detect" }
margin-diarize = { version = "0.1.0", path = "../diarize" }
margin-domain = { version = "0.1.0", path = "../domain" }
margin-store = { version = "0.1.0", path = "../store" }
margin-stt = { version = "0.1.0", path = "../stt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time", "fs"] }
tracing = "0.1.44"
uuid = "1.29.2"

[dev-dependencies]
async-trait = "0.1.92"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
