[package]
name = "cilica-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.28", features = ["derive", "uuid", "chrono", "serde_json"] }
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v7", "serde"] }
