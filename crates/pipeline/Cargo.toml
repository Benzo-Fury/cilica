[package]
name = "cilica-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["opus"]
# Keep recordings as Ogg Opus (see cilica-audio). Without it they are kept as WAV.
opus = ["cilica-audio/opus"]

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
futures = "0.3.34"
hound = "3.5.1"
cilica-audio = { path = "../audio", default-features = false }
cilica-detect = { path = "../detect" }
cilica-diarize = { path = "../diarize" }
cilica-domain = { path = "../domain" }
cilica-store = { path = "../store" }
cilica-stt = { path = "../stt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time", "fs"] }
tracing = "0.1.44"
uuid = "1.29.2"

[dev-dependencies]
async-trait = "0.1.92"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
