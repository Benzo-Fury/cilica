<!-- @dsCard group="Inputs" height=110 subtitle="Click to toggle. Hold to see the knob stretch." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>

<div class="nt-stack" style="padding:20px;max-width:380px">
 <div style="display:flex;align-items:center;justify-content:space-between"><span>Detect meetings automatically</span><button class="nt-switch" role="switch" aria-checked="true" aria-label="Detect meetings"></button></div>
 <div style="display:flex;align-items:center;justify-content:space-between"><span>Play recording sounds</span><button class="nt-switch" role="switch" aria-checked="false" aria-label="Play sounds"></button></div>
</div>


<script>document.querySelectorAll('.nt-switch').forEach(function(s){s.onclick=function(){s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true');};});</script>
</body>
</html>
