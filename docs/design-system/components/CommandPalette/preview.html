<!-- @dsCard group="Navigation" height=430 subtitle="⌘K. Glass over a dimmed, lightly blurred app. Arrow keys move the highlight." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>

<div class="nt-scrim" style="padding:28px 16px;display:grid;justify-items:center;align-items:start;min-height:380px">
 <div class="nt-palette nt-glass-strong" tabindex="0" id="pal">
  <div class="nt-palette-input"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search nt-ico" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="pq" placeholder="Search or run a command" value="pri"><kbd class="nt-kbd">esc</kbd></div>
  <div class="nt-palette-list" id="pl"><span class="nt-prow-sel" id="psel"></span>
   <div class="nt-palette-group">Notes</div>
   <div class="nt-prow" data-selected><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text nt-ico" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span><b>Pri</b>cing interview, Marco</span><span class="nt-prow-hint">Product · 2d</span></div>
   <div class="nt-prow"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text nt-ico" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg><span>Q3 planning sync · <b>Pri</b>ya</span><span class="nt-prow-hint">Product · Today</span></div>
   <div class="nt-palette-group">People</div>
   <div class="nt-prow"><span class="nt-avatar" style="--c:var(--speaker-6);--s:var(--speaker-6-soft);width:18px;height:18px;font-size:8px">PS</span><span><b>Pri</b>ya Shah</span><span class="nt-prow-hint">23 meetings</span></div>
   <div class="nt-palette-group">Commands</div>
   <div class="nt-prow"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic nt-ico" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg><span>Start recording</span><span class="nt-prow-hint"><span class="nt-kbd-group"><kbd class="nt-kbd">⌘</kbd><kbd class="nt-kbd">⇧</kbd><kbd class="nt-kbd">R</kbd></span></span></div>
  </div>
  <div class="nt-palette-foot"><span><span class="nt-kbd-group"><kbd class="nt-kbd">↑</kbd><kbd class="nt-kbd">↓</kbd></span>Move</span><span><kbd class="nt-kbd">↩</kbd>Open</span><span><span class="nt-kbd-group"><kbd class="nt-kbd">⌘</kbd><kbd class="nt-kbd">↩</kbd></span>Ask assistant</span></div>
 </div>
</div>


<script>
var rows=[].slice.call(document.querySelectorAll('.nt-prow')),sel=document.getElementById('psel'),list=document.getElementById('pl'),k=0;
function go(n){k=(n+rows.length)%rows.length;rows.forEach(function(r,j){if(j===k)r.setAttribute('data-selected','');else r.removeAttribute('data-selected');});sel.style.transform='translateY('+(rows[k].offsetTop)+'px)';}
setTimeout(function(){sel.style.top='0';sel.style.transition='none';go(0);requestAnimationFrame(function(){sel.style.transition='';});},80);
document.addEventListener('keydown',function(e){if(e.key==='ArrowDown'){e.preventDefault();go(k+1)}if(e.key==='ArrowUp'){e.preventDefault();go(k-1)}});
rows.forEach(function(r,j){r.onmouseenter=function(){go(j)}});
</script>
</body>
</html>
