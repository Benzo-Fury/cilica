[package]
name = "margin-stt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
crossbeam-channel = "0.5.17"
futures = "0.3.34"
margin-domain = { version = "0.1.0", path = "../domain" }
margin-onnx = { version = "0.1.0", path = "../onnx" }
ort = "2.0.0-rc.15"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "fs", "io-util", "net", "rt-multi-thread"] }
tracing = "0.1.44"
whisper-rs = "0.16.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[dev-dependencies]
hound = "3.5.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
