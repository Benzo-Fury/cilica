cpreview((p, I) => {

return `<div>${tr(1,"Marco","12:01","Then the importer ships behind a flag, and we watch the error rate for a week.")}${tr(2,"Lena","12:09","Who writes the migration guide?")}${tr(1,"Marco","12:14","I can take that one",1)}</div>`;
