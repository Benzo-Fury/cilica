<!-- @dsCard group="Actions" height=180 subtitle="Primary, secondary, ghost, glass, danger. Hover each one." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>

<div class="nt-stack" style="padding:20px">
 <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
  <button class="nt-btn nt-btn-primary nt-anim"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic nt-ico nt-i-mic" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>Start recording</button>
  <button class="nt-btn nt-btn-secondary nt-anim"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus nt-ico nt-i-plus" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>New note</button>
  <button class="nt-btn nt-btn-ghost nt-anim"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-share nt-ico nt-i-up" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/></svg>Share</button>
  <button class="nt-btn nt-btn-danger nt-anim"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash-2 nt-ico nt-i-trash" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>Move to Trash</button>
 </div>
 <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px;border-radius:14px;background: radial-gradient(circle at 20% 30%, var(--speaker-1) 0 18%, transparent 19%), radial-gradient(circle at 70% 60%, var(--accent) 0 22%, transparent 23%), radial-gradient(circle at 45% 90%, var(--speaker-3) 0 14%, transparent 15%), var(--bg-sunken);">
  <button class="nt-btn nt-btn-glass nt-anim"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles nt-ico nt-i-search" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>Ask about this note</button>
  <button class="nt-btn nt-btn-glass nt-btn-sm nt-anim"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy nt-ico nt-i-copy" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Copy</button>
  <button class="nt-btn nt-btn-primary nt-btn-lg nt-anim">Continue<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-right nt-ico nt-i-arrow" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
  <button class="nt-btn nt-btn-secondary" disabled>Disabled</button>
 </div>
</div>


<script>document.querySelectorAll('.nt-btn-glass,.nt-specular').forEach(function(el){el.addEventListener('pointermove',function(e){var r=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-r.left)+'px');el.style.setProperty('--my',(e.clientY-r.top)+'px');});});</script>
</body>
</html>
