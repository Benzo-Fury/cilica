<!-- @dsCard group="Recording" height=270 subtitle="Always-on-top pill at the top of the screen while recording. Click to expand. Black hugs the notch on Macs; glass elsewhere." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>

<div style="display:grid;gap:18px;justify-items:center;padding:16px 16px 24px;background:linear-gradient(var(--bg-window),var(--bg-window)),var(--bg-window)">
 <div style="width:100%;height:24px;background:var(--glass-fill);box-shadow:inset 0 -0.5px 0 var(--line);border-radius:8px;display:flex;align-items:center;padding:0 10px;font-size:12px;gap:14px" class="nt-faint"><b style="color:var(--ink)">Video call</b>Meeting  View  Window</div>
 <div class="nt-island" id="isl" role="button" tabindex="0" aria-label="Recording controls">
  <div class="nt-island-compact"><span class="nt-rec-dot"></span><span class="nt-wave"><i style="--h:40%"></i><i style="--h:80%"></i><i style="--h:55%"></i><i style="--h:90%"></i><i style="--h:45%"></i></span><span class="nt-mono" style="margin-left:auto" id="it">12:04</span></div>
  <div class="nt-island-full">
   <span class="nt-rec-dot" style="width:10px;height:10px"></span>
   <div style="flex:1;min-width:0"><div style="font:600 14px/18px var(--font-sans)">Q3 planning sync</div><div style="font:450 12px/16px var(--font-mono);opacity:.65" id="it2">Recording · 12:04</div></div>
   <button class="nt-iconbtn" style="color:#f5f3f1;border-radius:50%;width:34px;height:34px;background:rgb(255 255 255 / .12)" aria-label="Pause"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pause nt-ico" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg></button>
   <button class="nt-stop" style="width:34px;height:34px" aria-label="Stop"></button>
  </div>
 </div>
 <div class="nt-island" data-glass><div class="nt-island-compact"><span class="nt-rec-dot"></span><span class="nt-wave"><i style="--h:40%"></i><i style="--h:80%"></i><i style="--h:55%"></i><i style="--h:90%"></i><i style="--h:45%"></i></span><span class="nt-mono" style="margin-left:auto">03:41</span></div></div>
 <span class="nt-faint" style="font-size:12px">Top: Mac with a notch (black). Bottom: Windows, Linux and Macs without a notch (glass).</span>
</div>


<script>
var isl=document.getElementById('isl');isl.onclick=function(e){if(e.target.closest('button'))return;if(isl.hasAttribute('data-expanded'))isl.removeAttribute('data-expanded');else isl.setAttribute('data-expanded','');};
var bs=[].slice.call(document.querySelectorAll('.nt-island .nt-wave i'));setInterval(function(){bs.forEach(function(b,i){b.style.setProperty('--h',(25+Math.abs(Math.sin(Date.now()/200+i))*70)+'%')})},110);
</script>
</body>
</html>
