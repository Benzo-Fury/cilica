<!-- @dsCard group="Foundations" height=360 page subtitle="The four springs. Press Play to compare travel and settle." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>

<div style="padding:20px;display:grid;gap:14px">
 <div style="display:flex;gap:10px;align-items:center"><button class="nt-btn nt-btn-primary nt-btn-sm" id="play">Play</button><span class="nt-faint" style="font-size:13px">Each dot travels the same distance with its spring.</span></div>
 <div id="lanes" style="display:grid;gap:10px"></div>
</div>


<script>
var S=[['snappy','0.2s · bounce 0.15','Hover nudges, toggles, press release, chevrons'],['smooth','0.3s · bounce 0.1','Panels, segmented thumb, collapse, palette'],['bouncy','0.35s · bounce 0.3','Record morph, toasts, Dynamic Island, drops'],['gentle','0.45s · bounce 0','View changes, Notes ⇄ Transcript, large layout']];
var L=document.getElementById('lanes');
S.forEach(function(s){var r=document.createElement('div');r.style.cssText='display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center';
r.innerHTML='<div><div style="font:600 13px/18px var(--font-sans)">'+s[0]+'</div><div class="nt-faint nt-mono" style="font-size:11px">'+s[1]+'</div></div><div style="position:relative;height:36px;border-radius:18px;background:var(--fill-hover)"><span data-s="'+s[0]+'" style="position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:var(--accent);box-shadow:var(--shadow-sm);transition:transform var(--spring-'+s[0]+'-dur) var(--spring-'+s[0]+')"></span><span class="nt-faint" style="position:absolute;right:14px;top:9px;font-size:12px">'+s[2]+'</span></div>';L.appendChild(r);});
var on=false;document.getElementById('play').onclick=function(){on=!on;document.querySelectorAll('[data-s]').forEach(function(d){var w=d.parentNode.offsetWidth-36;d.style.transform=on?'translateX('+w*0.42+'px)':'none';});};
</script>
</body>
</html>
