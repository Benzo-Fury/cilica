<!-- @dsCard group="Content" height=300 subtitle="A selected, centred image with its caption, and a missing image." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>
<div class="nt-pad nt-note" style="max-width:560px;padding-left:48px">
  <figure class="nt-image" data-align="center" data-selected data-state="ready">
    <div class="nt-image-frame" style="width:320px">
      <button type="button" class="nt-image-grip" aria-label="Move image" style="opacity:1"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg></button>
      <img class="nt-image-img" alt="Ridges" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 180'><rect width='320' height='180' fill='%23efe7da'/><path d='M0 120 L80 80 L150 110 L230 60 L320 100 V180 H0Z' fill='%23c9b79c'/><path d='M0 150 L90 115 L170 140 L250 105 L320 130 V180 H0Z' fill='%23574b3e'/></svg>">
    </div>
    <figcaption class="nt-image-caption" style="max-width:320px">The ridgeline at dawn</figcaption>
  </figure>
  <figure class="nt-image" data-state="missing">
    <div class="nt-image-frame">
      <div class="nt-image-missing">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="22" y1="2" y2="22"/><path d="M10.41 10.41a2 2 0 1 1-2.83-2.83"/><line x1="13.5" x2="6" y1="13.5" y2="21"/><line x1="18" x2="21" y1="12" y2="15"/><path d="M3.59 3.59A1.99 1.99 0 0 0 3 5v14a2 2 0 0 0 2 2h14c.55 0 1.052-.22 1.41-.59"/><path d="M21 15V5a2 2 0 0 0-2-2H9"/></svg>
        <div class="nt-image-missing-text"><p class="nt-image-missing-title">Image missing</p><p class="nt-image-missing-detail">Its file is no longer in Cilica's attachments folder.</p></div>
        <div class="nt-image-missing-actions"><button class="nt-btn nt-btn-secondary nt-btn-sm nt-anim">Replace…</button></div>
      </div>
    </div>
  </figure>
</div>
</body>
</html>
