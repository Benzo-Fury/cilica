[package]
name = "margin-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["opus"]
# Ogg Opus encoding of finished recordings (libopus built with cmake). Without it recordings are
# kept as WAV. Turn it off to type-check other targets from macOS:
# `cargo check -p margin-audio --target x86_64-pc-windows-msvc --no-default-features`.
opus = ["dep:opus", "dep:ogg"]

[dependencies]
aec3 = "0.4.0"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
hound = "3.5.1"
margin-domain = { version = "0.1.0", path = "../domain" }
ogg = { version = "0.9.2", optional = true }
opus = { version = "0.4.0", optional = true }
ringbuf = "0.6.0"
rubato = "5.0.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros"] }
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.29.0", default-features = false, features = ["core_audio", "av", "ax", "blocks", "async", "dispatch", "macos_14_4"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.27.0"
windows = { version = "0.62.2", features = ["Win32_System_Registry", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.10.1"
