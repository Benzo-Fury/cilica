[package]
name = "margin-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
margin-agent = { version = "0.1.0", path = "../agent" }
margin-domain = { version = "0.1.0", path = "../domain" }
margin-store = { version = "0.1.0", path = "../store" }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "io-util", "io-std", "net"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
