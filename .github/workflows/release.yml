# Builds, signs and uploads Cilica for every platform when a GitHub release is published.
#
# Publish a release with a tag like `v0.2.0`. The tag must match the version in the root Cargo.toml
# (`[workspace.package]`), which is the one place to bump. Each platform builds on its own runner and attaches its installers,
# plus the signed updater packages and `latest.json` that installed copies check for updates.
# See docs/releasing.md for the secrets this needs.

name: Release

on:
  release:
    types: [published]
  # Rebuild an existing release from the current branch, for example after a platform failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach to, like v0.1.0
        required: true
      platform:
        description: Platform to build
        type: choice
        options: [all, macOS (Apple Silicon), Windows, Linux]
        default: all

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # Picks the platforms to build: all of them for a published release, or the one asked for.
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          ALL='[
            {"name":"macOS (Apple Silicon)","os":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin"},
            {"name":"Windows","os":"windows-latest","target":"x86_64-pc-windows-msvc","args":""},
            {"name":"Linux","os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","args":""}
          ]'
          echo "matrix=$(jq -c --arg p "$PLATFORM" 'map(select($p == "all" or .name == $p))' <<<"$ALL")" >> "$GITHUB_OUTPUT"

  build:
    needs: platforms
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not stop the others from shipping.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      # ───────── Toolchains ─────────

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libpipewire-0.3-dev libspa-0.2-dev libasound2-dev libclang-dev clang cmake pkg-config

      # ───────── Version and secrets ─────────

      - name: Check the release tag matches the app version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p;}' Cargo.toml)
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG does not match the version in Cargo.toml ($CARGO_VERSION). Bump [workspace.package] version, push, then re-tag."
            exit 1
          fi
          echo "Building Cilica $VERSION"

      - name: Write the App Store Connect key for notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # ───────── Build, sign and upload ─────────

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build and attach to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater packages (every platform)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing and notarization (ignored elsewhere)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Lay out the disk image window (background, icon positions) on CI too; Tauri skips
          # the Finder step when CI is set unless this is "true"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.event.release.tag_name || inputs.tag }}
          updaterJsonPreferNsis: true
