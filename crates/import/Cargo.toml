[package]
name = "margin-import"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
csv = "1.4.0"
futures = "0.3.34"
htmd = "0.5.6"
margin-domain = { path = "../domain" }
margin-store = { path = "../store" }
md-5 = "0.11.0"
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "process"] }
tracing = "0.1.44"
walkdir = "2.5.0"
yaml-rust2 = "0.13.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
