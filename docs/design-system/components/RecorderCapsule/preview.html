<!-- @dsCard group="Recording" height=230 subtitle="Docked bottom-centre of the note. Hover the live capsule: it widens to reveal sources and pause." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body>

<div style="padding:24px;display:grid;gap:22px;justify-items:center;background: radial-gradient(circle at 20% 30%, var(--speaker-1) 0 18%, transparent 19%), radial-gradient(circle at 70% 60%, var(--accent) 0 22%, transparent 23%), radial-gradient(circle at 45% 90%, var(--speaker-3) 0 14%, transparent 15%), var(--bg-sunken);">
 <button class="nt-capsule nt-capsule-idle nt-glass nt-anim-host nt-specular"><span class="nt-rec-dot"></span>Start recording<span class="nt-kbd-group" style="margin-left:6px"><kbd class="nt-kbd">⌘</kbd><kbd class="nt-kbd">⇧</kbd><kbd class="nt-kbd">R</kbd></span></button>
 <div class="nt-capsule nt-glass" id="cap" tabindex="0">
  <span class="nt-rec-dot"></span><span class="nt-mono" style="font-size:13px;min-width:44px" id="tm">12:04</span>
  <span class="nt-wave" id="wv" style="color:var(--ink)"><i style="--h:30%"></i><i style="--h:60%"></i><i style="--h:90%"></i><i style="--h:50%"></i><i style="--h:75%"></i><i style="--h:40%"></i><i style="--h:85%"></i><i style="--h:55%"></i><i style="--h:35%"></i><i style="--h:65%"></i><i style="--h:45%"></i><i style="--h:70%"></i></span>
  <span class="nt-capsule-extra">
   <button class="nt-chip" style="background:transparent"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic nt-ico" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>MacBook mic</button>
   <button class="nt-chip" style="background:transparent"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-volume-2 nt-ico" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>Zoom</button>
   <button class="nt-iconbtn nt-anim" aria-label="Pause"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pause nt-ico nt-i-check" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg></button>
  </span>
  <button class="nt-stop" aria-label="Stop recording"></button>
 </div>
</div>


<script>
var bars=[].slice.call(document.querySelectorAll('#wv i')),s=724;
setInterval(function(){bars.forEach(function(b,i){var v=20+Math.abs(Math.sin(Date.now()/240+i*1.3))*60+Math.random()*20;b.style.setProperty('--h',v+'%')});},110);
setInterval(function(){s++;document.getElementById('tm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);
</script><script>document.querySelectorAll('.nt-btn-glass,.nt-specular').forEach(function(el){el.addEventListener('pointermove',function(e){var r=el.getBoundingClientRect();el.style.setProperty('--mx',(e.clientX-r.left)+'px');el.style.setProperty('--my',(e.clientY-r.top)+'px');});});</script>
</body>
</html>
