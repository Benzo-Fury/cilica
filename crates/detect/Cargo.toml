[package]
name = "cilica-detect"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cilica-domain = { path = "../domain" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.29.0", default-features = false, features = ["core_audio", "ax", "app", "blocks", "dispatch", "macos_14_4"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.27.0"
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_Foundation"] }
