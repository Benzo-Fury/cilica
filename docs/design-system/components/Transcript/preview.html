 <div class="nt-utt"><span class="nt-avatar" style="--c:var(--speaker-6);--s:var(--speaker-6-soft)">PS</span><div class="nt-utt-head"><span class="nt-utt-name">Priya Shah</span><span class="nt-utt-time">14:02</span></div>
